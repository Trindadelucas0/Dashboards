name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy no servidor
    runs-on: self-hosted
    timeout-minutes: 15

    env:
      DEPLOY_PATH: /root/PROJETOS/exito/Dashboards

    steps:
      - name: Atualizar, compilar e validar producao
        run: |
          set -euo pipefail

          cd "$DEPLOY_PATH"
          git fetch origin main
          git reset --hard origin/main
          sed 's/\r$//' scripts/vps-root-deploy-nova.txt | bash
